services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: gateway-postgres
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: gateway-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: